<text class="ts" x="110" y="380" text-anchor="middle" dominant-baseline="central">VDD 3V3 · L/R GND</text>
</g>
<g class="purple">
<rect x="490" y="380" width="160" height="60" rx="6" stroke-width="0.5"/>
<text class="th" x="570" y="398" text-anchor="middle" dominant-baseline="central">Amp (MAX98357A)</text>
<text class="ts" x="570" y="416" text-anchor="middle" dominant-baseline="central">LRC 39 · BCLK 47</text>
<text class="ts" x="570" y="430" text-anchor="middle" dominant-baseline="central">DIN 21 · SD 5V</text>
</g>
<g class="gray">
<rect x="30" y="482" width="160" height="50" rx="6" stroke-width="0.5"/>
<text class="th" x="110" y="499" text-anchor="middle" dominant-baseline="central">Power rails</text>
<text class="ts" x="110" y="516" text-anchor="middle" dominant-baseline="central">5V: radars + amp</text>
</g>
<g class="coral">
<rect x="490" y="120" width="160" height="60" rx="6" stroke-width="0.5"/>
<text class="th" x="570" y="138" text-anchor="middle" dominant-baseline="central">RGB LED</text>
<text class="ts" x="570" y="156" text-anchor="middle" dominant-baseline="central">R 1 · G 42 · B 41</text>
<text class="ts" x="570" y="170" text-anchor="middle" dominant-baseline="central">220 Ω each, common GND</text>
</g>

