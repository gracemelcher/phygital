<svg xmlns="http://www.w3.org/2000/svg" width="680" height="640" viewBox="0 0 680 640" role="img">
<title>ESP32-S3 wiring for the phygital sensor hub</title>
<desc>ESP32-S3-DevKitC-1 with three radars and mic wired to the left header, and the amp and RGB LED to the right header. Radars and amp use 5V, mic uses 3V3, and the cable goes in the USB port.</desc>
<style>
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .t  { font-size: 14px; fill: #2C2C2A; }
  .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
  .ts { font-size: 12px; fill: #5F5E5A; }
  .teal rect   { fill: #E1F5EE; stroke: #0F6E56; } .teal .th   { fill: #085041; } .teal .ts   { fill: #0F6E56; }
  .purple rect { fill: #EEEDFE; stroke: #534AB7; } .purple .th { fill: #3C3489; } .purple .ts { fill: #534AB7; }
  .coral rect  { fill: #FAECE7; stroke: #993C1D; } .coral .th  { fill: #712B13; } .coral .ts  { fill: #993C1D; }
  .gray rect   { fill: #F1EFE8; stroke: #5F5E5A; } .gray .th   { fill: #444441; } .gray .ts   { fill: #5F5E5A; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="0" y="0" width="680" height="640" fill="#FFFFFF"/>
<rect x="250" y="40" width="180" height="500" rx="8" fill="#FAF9F5" stroke="#888780" stroke-width="0.5"/>
