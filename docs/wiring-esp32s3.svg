<g class="teal">
<rect x="30" y="70" width="160" height="50" rx="6" stroke-width="0.5"/>
<text class="th" x="110" y="87" text-anchor="middle" dominant-baseline="central">Radar 1</text>
<text class="ts" x="110" y="104" text-anchor="middle" dominant-baseline="central">TX→4 · RX→5</text>
</g>
<g class="teal">
<rect x="30" y="135" width="160" height="50" rx="6" stroke-width="0.5"/>
<text class="th" x="110" y="152" text-anchor="middle" dominant-baseline="central">Radar 2</text>
<text class="ts" x="110" y="169" text-anchor="middle" dominant-baseline="central">TX→6 · RX→7</text>
</g>
<g class="teal">
<rect x="30" y="200" width="160" height="50" rx="6" stroke-width="0.5"/>
