<text class="th" x="340" y="280" text-anchor="middle" dominant-baseline="central">S3</text>
<text class="ts" x="340" y="300" text-anchor="middle" dominant-baseline="central">N8R2</text>
</g>

<g stroke-width="1.2" fill="none">
<line x1="190" y1="88" x2="266" y2="140" stroke="#1D9E75"/>
