<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phygital app preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Shows the phone app (phone.html) inside an iPhone 18 Pro-sized frame, scaled to fit the window.
   iPhone 18 Pro: 150.0 x 71.9 mm body, 2622 x 1206 px screen at 3x = 402 x 874 pt, so the body is about 434 x 906 pt. */
:root { --page: #1C1C1E; --text: #9B9A92; }
html, body { margin: 0; height: 100%; background: var(--page); font-family: "Instrument Sans", -apple-system, sans-serif; color: var(--text); }
body { display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
.stage { position: relative; }
.device { position: absolute; left: 0; top: 0; width: 434px; height: 906px; transform-origin: 0 0; }
/* titanium band, black bezel, then the screen */
.band { position: absolute; inset: 0; border-radius: 72px; background: #8D8A84;
  box-shadow: inset 0 0 0 1px #6E6B66, inset 0 0 0 3px #B5B2AB, 0 30px 80px rgba(0, 0, 0, .55); }
.bezel { position: absolute; inset: 4px; border-radius: 68px; background: #0B0B0B; }
.screen { position: absolute; left: 16px; top: 16px; width: 402px; height: 874px; border-radius: 56px; overflow: hidden; background: #ECECE0; }
.screen iframe { width: 402px; height: 874px; border: 0; display: block; }
.btn { position: absolute; width: 4px; border-radius: 2px; background: #7D7A74; }
.caption { position: absolute; left: 50%; transform: translateX(-50%); width: min(560px, 92vw); text-align: center; font-size: 13px; line-height: 1.5; }
.caption a { color: inherit; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="device" id="device">
    <div class="btn" style="left:-3px; top:150px; height:34px"></div>
    <div class="btn" style="left:-3px; top:205px; height:62px"></div>
    <div class="btn" style="left:-3px; top:280px; height:62px"></div>
    <div class="btn" style="right:-3px; top:230px; height:100px"></div>
    <div class="band"></div>
    <div class="bezel"></div>
    <div class="screen"><iframe src="phone.html" title="Phygital app" allow="serial"></iframe></div>
  </div>
  <div class="caption" id="caption">Interactive prototype · tap “Device disconnected” to connect or try demo data · <a href="admin.html">Admin dashboard</a></div>
</div>
<script>
// Scale the 434 x 906 device to fit the window, leaving room for the caption.
function fit() {
  const s = Math.min(1, (innerHeight - 70) / 906, (innerWidth - 32) / 434);
  document.getElementById('device').style.transform = `scale(${s})`;
  const stage = document.getElementById('stage');
  stage.style.width = 434 * s + 'px'; stage.style.height = 906 * s + 34 + 'px';
  document.getElementById('caption').style.top = 906 * s + 14 + 'px';
}
addEventListener('resize', fit); fit();
</script>
</body>
</html>
